<div class="wrap">
  <header class="page-top">
    <h1 class="h-page">Cała kolekcja</h1>
    <p>Bransoletki i breloki z kamieni naturalnych. Wybierz serię, a na stronie produktu obejrzysz go w 3D.</p>
  </header>
  <div class="filters">
    <div class="chips" role="group" aria-label="Filtruj po serii">{{filters}}</div>
    <div class="sort">
      <span class="result-note" data-result-note role="status"></span>
      <label for="sort">Sortuj</label>
      <select id="sort" data-sort>
        <option value="">Polecane</option>
        <option value="asc">Cena: od najniższej</option>
        <option value="desc">Cena: od najwyższej</option>
      </select>
    </div>
  </div>
  <div class="grid-cards" data-catalog>
{{cards:all}}
  </div>
</div>
